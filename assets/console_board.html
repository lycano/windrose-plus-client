<title>Windrose+ Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* hidden must win over the display rules below (Artifact hosts add this; a standalone page needs it here) */
[hidden] { display: none !important; }
/* Layout: one column — the game screen with the console as the hero, the status board below it.
   Single dark look on purpose: the colors are the console's own palette (WindroseClientProxy README), so the page and
   the mockup read as one instrument. Keep the --c-* tokens in sync with console_ui.cpp (the state's palette check). */
:root {
  color-scheme: dark;
  /* console palette (console_ui.cpp) */
  --c-window: rgba(28, 28, 33, .94);   /* #1C1D21 @94% */
  --c-frame: rgba(23, 25, 28, .95);    /* #18191D */
  --c-sunken: rgba(18, 20, 23, .95);   /* #131417 */
  --c-border: rgba(61, 66, 74, .85);   /* #3E424B */
  --c-sep: rgba(46, 48, 54, .85);      /* #2E3036 */
  --c-text: #9DA0A8;
  --c-input: #A5A9B2;
  --c-server: #BAA57A;
  --c-muted: #5F636E;
  --c-cmd: #58C2A2;
  --c-notice: #D8A053;
  --c-error: #CE4D4F;
  --c-banner: rgba(70, 72, 81, .85);
  --c-scanner: #AB2A28;
  --c-row-sel: #2A2D34;
  --c-burger: #B8AF98;
  /* page */
  --bg: #0E0F12;
  --surface: #16171B;
  --line: #2A2C33;
  --fg: #C9CBD1;
  --fg-dim: #7C808B;
  --ok: #58C2A2;
  --warn: #D8A053;
  --bad: #CE4D4F;
  --f-ui: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
h1 { margin: 0; font-size: 1.55rem; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--c-server); }
.stamp { font: 12.5px var(--f-mono); color: var(--fg-dim); }
.proposal { border: 1px dashed var(--warn); color: var(--warn); padding: 6px 12px; border-radius: 3px; font-size: 13.5px; }
h2 { margin: 0 0 10px; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-dim); }

/* ---- game screen + console ---- */
.screen {
  position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 440px; overflow: hidden; border-radius: 4px;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 70% at 70% 0%, rgba(210, 170, 110, .30), transparent 60%),
    linear-gradient(180deg, #45566A 0%, #6F7F8C 46%, #2D4756 47%, #1B3241 70%, #0F2230 100%);
}
.screen .hud { position: absolute; left: 14px; bottom: 12px; font: 12px var(--f-mono); color: rgba(255,255,255,.55); }
.console {
  position: absolute; left: 0; right: 0; top: 0; height: 45%;
  background: var(--c-window); border: 1px solid var(--c-border); border-radius: 3px;
  padding: 8px; display: flex; flex-direction: column; gap: 4px;
  font: var(--c-font-size, 16px)/1.38 var(--f-mono); color: var(--c-input);
  transform: translateY(-101%); transition: transform 133ms linear; /* anim_speed 7.5 → ~130 ms */
}
.console.open { transform: translateY(0); }
.c-head { white-space: nowrap; overflow: hidden; display: flex; align-items: flex-end; gap: 6px; min-height: 2.1em; margin-bottom: -4px; } /* tabs sit on the content border */
.c-head .t, .c-head > .h { align-self: center; }
.c-head .tabs { display: flex; gap: 3px; align-self: stretch; align-items: flex-end; }
.c-head .t { color: var(--c-server); } .c-head .h { color: var(--c-muted); } .c-head .ctx { color: var(--c-cmd); }
.c-sep { height: 1px; background: var(--c-sep); flex: none; }
/* tabs (console_ui.cpp header): outline top / left / right, the active one joins the region below (no border under it) */
.tab { font: inherit; color: var(--c-muted); background: #18191D; border: 1px solid var(--c-border); border-bottom: 0; border-radius: 2px 2px 0 0;
       padding: .25em .9em; margin-bottom: -1px; cursor: pointer; position: relative; z-index: 1; }
.tab:hover { color: #7FA89A; background: #2A2D34; } /* dim seafoam: less than the active tab */
.tab.on { color: var(--c-cmd); background: var(--c-sunken); box-shadow: inset 0 1px 0 rgba(88,194,162,.78); }
/* Servers view (console_ui.cpp RenderServersView): chips, table, status, details, inline password */
.sv { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; background: var(--c-sunken); border: 1px solid var(--c-border); padding: 4px 8px; }
.sv-bar { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; color: var(--c-muted); }
.chip { font: inherit; color: var(--c-muted); background: #18191D; border: 1px solid var(--c-border); border-radius: 2px; padding: 0 .5em; cursor: pointer; }
.chip:hover { background: #2A2D34; color: var(--c-server); } .chip.on { color: var(--c-cmd); background: var(--c-row-sel); } .chip.on:hover { color: #7FE0C2; }
.tbl-wrap { flex: 1 1 auto; min-height: 48px; overflow: auto; }
table.tbl { width: 100%; border-collapse: collapse; white-space: nowrap; }
.tbl th { position: sticky; top: 0; background: #1E2025; color: var(--c-server); font-weight: 400; text-align: left; padding: 1px 8px; cursor: pointer; user-select: none; border-right: 1px solid var(--c-sep); }
.tbl th.ns { cursor: default; }
.tbl td { padding: 0 8px; color: var(--c-muted); border-right: 1px solid var(--c-sep); }
.tbl tbody tr:nth-child(even) { background: rgba(255,255,255,.025); }
.tbl tbody tr { cursor: pointer; } .tbl tbody tr:hover { background: #2A2D34; } .tbl th:not(.ns):hover { background: #2A2D34; }
.tbl tbody tr.sel { background: #23262C; }
.tbl td.nm { color: var(--c-input); } .tbl tr.sel td.nm, .tbl tr.sel td.no { color: var(--c-cmd); } .tbl td.fav { color: var(--c-notice); } .tbl td.tx { color: var(--c-text); }
.sv-status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-det { display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.sv-det .k { color: var(--c-cmd); } .sv-det .v { color: var(--c-input); } .sv-det .m { color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; } .sv-det .sp { flex: 1; }
.btn { font: inherit; color: var(--c-input); background: #18191D; border: 1px solid var(--c-border); border-radius: 2px; padding: .1em .9em; cursor: pointer; }
/* RoleButton (console_ui.cpp): hover lightens the background and shifts the text by role */
.btn:hover { background: #2A2D34; color: var(--c-server); } .btn:active { background: #33363E; }
.btn.fav:hover { color: var(--c-notice); } .btn.del:hover, .btn.warn { color: var(--c-error); }
.btn.go, .btn.on { color: var(--c-cmd); } .btn.go:hover, .btn.on:hover { color: #7FE0C2; } .btn.on { background: var(--c-row-sel); }
.sv-pw { display: flex; gap: 8px; align-items: center; min-height: 1.6em; } .sv-pw.off > * { visibility: hidden; } /* row always reserved: the table never jumps */ .sv-pw span { color: var(--c-notice); white-space: nowrap; }
.sv-pw input { width: 220px; max-width: 40%; height: 21px; background: var(--c-frame); color: var(--c-input); border: 1px solid var(--c-border); border-radius: 2px; font: inherit; padding: 0 6px; outline: none; }
/* /ui view (console_ui.cpp RenderUiView) */
.uv { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--c-sunken); border: 1px solid var(--c-border); padding: 4px 8px; display: flex; flex-direction: column; gap: 3px; }
.uv .hd { color: var(--c-server); } .uv .m { color: var(--c-muted); } .uv .tx { color: var(--c-text); }
.uv table { border-collapse: collapse; white-space: nowrap; } .uv td { padding: 1px 8px; border-right: 1px solid var(--c-sep); }
.uv tr:hover { background: #2A2D34; } .uv tr.sel { background: #23262C; } /* one row style (PushRowColors): hover #2A2D34, selected darker */ .uv tr.sel td.k, .uv tr.sel td.v { color: var(--c-cmd); } .uv tr { cursor: pointer; }
.uv td.k { color: var(--c-input); } .uv td.v { color: var(--c-text); }
.uv .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.helpdim { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.6); } /* ImGui ModalWindowDimBg */
.helpov { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--c-frame); border: 1px solid var(--c-border); border-radius: 2px; padding: 6px 12px; white-space: pre; box-shadow: 0 6px 18px rgba(0,0,0,.45); max-width: 96%; overflow: auto; }
.ctxm { position: absolute; z-index: 5; background: var(--c-frame); border: 1px solid var(--c-border); border-radius: 2px; padding: 3px 0; min-width: 190px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.ctxm div { padding: 1px 12px; cursor: pointer; color: var(--c-input); } .ctxm div:hover { background: var(--c-row-sel); color: var(--c-server); }
.ctxm div.go:hover { color: #7FE0C2; } .ctxm div.fav:hover { color: var(--c-notice); } .ctxm div.del:hover { color: var(--c-error); }
.ctxm .sepl { height: 1px; background: var(--c-sep); margin: 3px 0; padding: 0; }
.c-log { flex: 1 1 auto; min-height: 40px; overflow: auto; background: var(--c-sunken); border: 1px solid var(--c-border); border-radius: 0; padding: 4px 8px; white-space: pre; }
.c-log div { min-height: 1.38em; }
.l-cmd { color: var(--c-cmd); } .l-server { color: var(--c-server); } .l-notice { color: var(--c-notice); }
.l-info, .l-text { color: var(--c-text); } .l-error { color: var(--c-error); } .l-banner { color: var(--c-banner); }
.c-pal { flex: none; max-height: min(30%, 200px); overflow-y: scroll; background: var(--c-frame); border: 1px solid var(--c-border); border-radius: 2px; padding: 4px 8px; }
.c-pal .ph { white-space: nowrap; } .c-pal .ph b { color: var(--c-server); font-weight: 400; } .c-pal .ph i { color: var(--c-muted); font-style: normal; }
.c-pal .row { white-space: nowrap; cursor: pointer; padding: 1px 0; }
.c-pal .row:hover { background: rgba(33, 36, 41, .85); }
.c-pal .row.sel { background: var(--c-row-sel); }
.c-pal .row .n { color: var(--c-input); } .c-pal .row.sel .n { color: var(--c-input); }
.c-pal .row .u { color: rgba(165,169,178,.85); } .c-pal .row .d { color: var(--c-muted); }
.c-pal .row.sub .n { color: var(--c-cmd); padding-left: 2.5ch; } .c-pal .row .plus { color: var(--c-notice); opacity: .9; }
.c-syn { flex: none; background: var(--c-sunken); border: 1px solid var(--c-sep); border-radius: 2px; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-syn .k { color: var(--c-cmd); } .c-syn .u { color: var(--c-input); } .c-syn .d, .c-syn .x { color: var(--c-muted); } .c-syn .x { opacity: .75; }
.c-scan { flex: none; height: 2px; background: rgba(30,32,36,.7); position: relative; overflow: hidden; }
.c-scan::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28%; background: var(--c-scanner); border-radius: 1px; animation: scan 1.54s ease-in-out infinite alternate; }
@keyframes scan { from { left: 0; } to { left: 72%; } }
.c-input { flex: none; display: flex; align-items: center; gap: 8px; }
.burger { flex: none; width: 27px; height: 23px; background: #17191C; border: 1px solid rgba(62,66,75,.85); border-radius: 2px; display: grid; place-content: center; gap: 3px; cursor: pointer; padding: 0; }
.burger i { display: block; width: 15px; height: 1.8px; background: var(--c-burger); }
.burger:hover, .burger.on { border-color: rgba(88,194,162,.86); background: #24262C; }
.burger:hover i, .burger.on i { background: #DCA052; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c-cmd); }
.dot.busy { animation: pulse .78s ease-in-out infinite alternate; }
@keyframes pulse { from { background: #F59E0B; } to { background: #F5C60B; } }
.prompt { color: var(--c-cmd); white-space: nowrap; }
#cin { flex: 1; min-width: 0; height: 23px; background: var(--c-frame); color: var(--c-input); border: 1px solid var(--c-border); border-radius: 2px; font: inherit; padding: 0 6px; outline: none; }
#cin:focus { background: rgba(36,38,44,.95); }
/* another input box has the keyboard: the command line is dim, no outline (console_ui.cpp dim_line) */
.c-input.dim .prompt, .c-input.dim #cin { color: rgba(95,99,110,.55); }
#cin::selection { background: rgba(88,194,162,.35); }

/* ---- controls ---- */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls button, .controls select {
  font: 500 13.5px var(--f-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; padding: 6px 11px; cursor: pointer;
}
.controls button:hover, .controls select:hover { border-color: var(--c-cmd); }
.controls button:focus-visible, .controls select:focus-visible, .burger:focus-visible, .row:focus-visible { outline: 2px solid var(--c-cmd); outline-offset: 1px; }
.controls kbd { font: 12px var(--f-mono); color: var(--c-server); }
.controls .sp { flex: 1; }
.keys { font: 12.5px var(--f-mono); color: var(--fg-dim); }

/* ---- status board ---- */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; min-width: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--fg-dim); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.pill { display: inline-block; font: 600 11.5px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 9px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--fg-dim); }
.big { font: 500 1.6rem var(--f-mono); color: var(--c-server); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
.items li { display: grid; grid-template-columns: 4.2em 6.6em 1fr; gap: 8px; align-items: baseline; }
.items li.sub { padding-left: 1.2em; }
.items .id { font: 12.5px var(--f-mono); color: var(--c-server); }
.items .note { color: var(--fg-dim); font-size: 12.5px; }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; font-size: 13px; }
.sw div { display: flex; gap: 8px; align-items: center; min-width: 0; }
.sw span.chip { flex: none; width: 18px; height: 18px; border-radius: 2px; border: 1px solid var(--line); }
.sw .r { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wide { grid-column: 1 / -1; }
@media (prefers-reduced-motion: reduce) { .console { transition: none; } .c-scan::after, .dot.busy { animation: none; } }
@media (max-width: 560px) { .items li { grid-template-columns: 3.6em 1fr; } .items li .note { grid-column: 2; } }
</style>

<div class="wrap">
  <header class="top">
    <h1><span>Windrose+</span> In-Game Console</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="proposal" id="proposal" hidden></div>

  <section>
    <div class="screen" id="screen">
      <div class="console" id="console" aria-label="Console mockup">
        <div class="c-head"><span class="t" id="ctitle"></span><span class="tabs"><button class="tab" id="tabWp">/wp</button><button class="tab" id="tabSv">/connect</button><button class="tab" id="tabUi">/ui</button><button class="tab" id="tabInfo">/info</button><button class="tab" id="tabUpd">/update</button></span><span class="h" id="chint"></span></div>
        <div class="c-log" id="clog"></div>
        <div class="sv" id="sv" hidden>
          <div class="sv-bar"><button class="chip" data-f="0">All</button><button class="chip" data-f="1">Favorites</button><button class="chip" data-f="2">Recent</button><span id="svcount"></span><span>| Up/Down: select | Shift+Up/Down: history | Enter / double-click: connect | right-click: more | ?: keys</span></div>
          <div class="tbl-wrap" id="tblwrap"><table class="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
          <div class="sv-status" id="svstatus"></div>
          <div class="sv-det" id="svdet"></div>
          <div class="sv-pw off" id="svpw"><span id="svpwl"></span><input id="svpwin" type="password" aria-label="Server password"><button class="btn" id="svpwshow">Show</button><button class="btn go" id="svpwok">Store</button><button class="btn del" id="svpwclr">Clear</button><button class="btn" id="svpwno">Cancel</button></div>
        </div>
        <div class="uv" id="uv" hidden></div>
        <div class="uv" id="iv" hidden></div>
        <div class="uv" id="updv" hidden></div>
        <div class="ctxm" id="ctxm" hidden></div>
        <div class="helpdim" id="helpdim" hidden></div>
        <div class="helpov" id="help" hidden></div>
        <div class="c-pal" id="cpal" hidden></div>
        <div class="c-syn" id="csyn" hidden></div>
        <div class="c-scan" id="cscan" hidden></div>
        <div class="c-sep"></div>
        <div class="c-input">
          <button class="burger" id="burger" title="Open Command Palette / Directory" aria-label="Command directory"><i></i><i></i><i></i></button>
          <span class="dot" id="cdot" title="Server connected &amp; ready."></span>
          <span class="prompt" id="cprompt">&gt;</span>
          <input id="cin" autocomplete="off" spellcheck="false" aria-label="Console input">
        </div>
      </div>
      <div class="hud">Windrose · client view (mock)</div>
    </div>
  </section>

  <div class="controls">
    <button id="bToggle"><kbd>F10</kbd> Toggle</button>
    <select id="selCat" aria-label="Command catalog"></select>
    <button id="bExec">Executing</button>
    <button id="bNotice">[Notice]</button>
    <button id="bError">[Error]</button>
    <button id="bClear">Reset log</button>
    <span class="sp"></span>
    <span class="keys">Tab cycle · ↑↓ history/palette · → select · Esc hide/close</span>
  </div>

  <section class="board" id="board"></section>
</div>

<script>
const STATE = /*__STATE__*/null;
// Fallback sample so the template renders on its own (marked as sample in the stamp)
const S = STATE || {
  generated: null,
  client: { version: "?", commit: null, branch: "?", dirty: [], build: null, local_install: null },
  ui: { title: "WINDROSE+ IN-GAME ADMIN CONSOLE", hint: "| Toggle: F10 | Close: ESC", height_fraction: .45, executing_timeout_s: 25,
        banner: ["=".repeat(79), " Windrose+ In-Game Admin Console", " Type 'wp.help' for command directory, 'wp.client ping' to check the server.", "=".repeat(79)],
        default_catalog: [{name:"wp.version",usage:"wp.version",desc:"Show client/server version and build"},{name:"wp.client",usage:"wp.client schema | wp.client ping",desc:"In-game console: command list, reachability check"},{name:"wp.help",usage:"wp.help [command]",desc:"Directory of available commands"}],
        palette: [] },
  addon: { version: "?", commit: null, dirty: [], enabled_on: {} }, workplan: [], schema: null,
};
// public by the permission defaults (core + client-console) + local commands; subcommand entries count by their full name
const PUBLIC = new Set(["wp.version", "wp.help", "wp.client", "wp.client schema", "wp.client ping", "wp.client hello", "wp.client update",
                        "/connect", "/quit", "/ui"]);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- console model (mirrors console_ui.cpp) ----------
// cat = the active catalog: the server's in the Windrose+ context, the /connect sub-commands in the connect context
const st = { open: true, exec: false, logs: [], hist: [], hpos: -1, cat: [], serverCat: [], context: "", pal: false, matches: [], pidx: 0,
             syn: -1, synDismissed: false, execTimer: null };
function switchContext(ctx) {
  st.context = ctx; st.cat = ctx === "/connect" ? (S.ui.connect_catalog || []) : ctx === "/ui" ? (S.ui.ui_catalog || []) : ctx === "/info" ? (S.ui.info_catalog || []) : ctx === "/update" ? (S.ui.update_catalog || []) : st.serverCat;
  st.pal = false; st.matches = []; st.pidx = 0; st.syn = -1; st.synDismissed = false;
}
const lower = s => s.toLowerCase().replace(/^[ \t]+/, "");
const token = s => { const l = lower(s); const i = l.search(/[ \t]/); return { tok: i < 0 ? l : l.slice(0, i), space: i >= 0 }; };

function logClass(l) {
  if (l.startsWith("> ") || l.startsWith("$ ")) return "l-cmd";
  if (l.startsWith("[Server]")) return "l-server";
  if (l.startsWith("[Notice]")) return "l-notice";
  if (l.startsWith("[Info]")) return "l-info";
  if (l.startsWith("[Error]") || l.includes("Access denied")) return "l-error";
  if (l.startsWith("=")) return "l-banner";
  return "l-text";
}
function addLog(text) { for (const l of String(text).split("\n")) st.logs.push(l); if (st.logs.length > 2000) st.logs.splice(0, st.logs.length - 1000); renderLog(true); }
// Subcommands (protocol 2) are entries named "<command> <subcommand>" (console_ui.cpp IsSubEntry / FilterPalette)
const isSub = c => c.name.includes(" ");

    <dt>Schema</dt><dd>${S.schema ? `${S.schema.commands.length} commands live from ${esc(S.schema.node)}` : `<span class="dim">not fetched (--schema NODE)</span>`}</dd></dl></div>
  <div class="card wide"><h2>Workplan K · ${counts.done} done · ${counts.prog} in test · ${counts.open} open</h2>
    <ul class="items">${wp.map(i => `<li${i.level ? ` class="sub" style="padding-left:${i.level * 1.2}em"` : ""}><span class="id">${esc(i.id)}</span>${pillFor(i.state)}<span>${esc(i.title)}${i.note ? `<br><span class="note">${esc(i.note)}</span>` : ""}</span></li>`).join("") || `<li><span class="dim">no workplan data</span></li>`}</ul></div>
  <div class="card wide"><h2>Palette · README vs console_ui.cpp ${drift.length ? `<span class="pill warn">${drift.length} drift</span>` : `<span class="pill ok">in sync</span>`}</h2>
    <div class="sw">${(S.ui.palette || []).map(p => `<div title="${esc(p.hex)}"><span class="chip" style="background:${esc(p.hex)}"></span><span class="r">${esc(p.role)} <span class="mono dim">${esc(p.hex)}</span>${p.in_code ? "" : ` <span class="warn">✕</span>`}</span></div>`).join("")}</div></div>`;
}

$("help").innerHTML = `<div><span class="l-server">NAVIGATION</span> <span class="m">| Esc or a click elsewhere closes this</span></div><div class="c-sep"></div>` + navRows();
const closeHelp = () => { $("help").hidden = true; $("helpdim").hidden = true; cin.focus(); }; // closed: the line gets the keyboard back
document.addEventListener("keydown", e => { if (!$("help").hidden && (e.key === "Escape" || e.key === "?")) { e.preventDefault(); e.stopPropagation(); closeHelp(); } }, true);
document.addEventListener("click", e => { if (!$("help").hidden && !e.target.closest("#help")) closeHelp(); });
// ---------- boot ----------
// Board preview = the client's defaults since 2026-10-18 (the user's own settings): zoom 1.5 (20 px), 65 % high
st.fontSize = 20;
S.ui.height_fraction = 0.65;
$("ctitle").textContent = S.ui.title; $("chint").textContent = S.ui.hint;
$("stamp").textContent = S.generated ? `state ${S.generated.replace("T", " ")}` : "sample state (template not rendered)";
if (S.proposal) { $("proposal").hidden = false; $("proposal").textContent = "Proposal: " + S.proposal; }
S.ui.banner.forEach(addLog);
addLog("[Info] Mockup: answers are simulated; the catalog and strings come from the current source.");
if (S.public) $("board").hidden = true; else board(); render(); // public showcase: no internal status board
</script>
